name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test

  backend:
    name: Backend (PHP 8.4, SQLite)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      COMPOSER: composer.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4.27'
          extensions: curl, fileinfo, mbstring, openssl, pdo_sqlite, sqlite3, pdo_mysql, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install locked PHP dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare disposable test configuration
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
      - run: npm run test:backend

  mysql:
    name: Backend (MySQL 8.4.13)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_DATABASE: blood_repository_ci
          MYSQL_USER: repository_test
          MYSQL_PASSWORD: isolated-ci-only
          MYSQL_ROOT_PASSWORD: isolated-root-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_DATABASE: blood_repository_ci
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: repository_test
      DB_PASSWORD: isolated-ci-only
      DB_URL: ''
      REPOSITORY_MYSQL_TEST: isolated
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      COMPOSER: composer.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: '8.4.27'
          extensions: curl, fileinfo, mbstring, openssl, pdo_mysql, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Install locked PHP dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare isolated configuration
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
      - run: npm run test:mysql
